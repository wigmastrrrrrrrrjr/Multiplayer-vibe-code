name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck + unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  staging-e2e:
    # Online tests before release: deploy staging, run E2E against the live
    # Worker. If this job fails, releases from main are disallowed (branch
    # protection marks this required).
    name: Deploy staging + online E2E
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: check
    env:
      STAGING_URL: ${{ secrets.STAGING_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy staging Worker (wrangler-free deploy script)
        run: npm run deploy:staging
      - run: npx playwright install --with-deps chromium
      - name: Online E2E against staging
        run: npm run e2e --workspace @mvc/e2e

  release-block:
    # Single required gate summarizing the online status for release tagging.
    needs: staging-e2e
    runs-on: ubuntu-latest
    steps:
      - run: echo "staging online E2E is green — release allowed"